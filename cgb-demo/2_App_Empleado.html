<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta name="theme-color" content="#06265e"><title>App Empleado</title><style>:root{--navy:#06265e;--navy2:#0b4f99;--blue:#0a8fd7;--cyan:#21b7ef;--text:#092754;--muted:#71819d;--line:#dce8f2;--shadow:0 12px 30px rgba(6,38,94,.12)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:linear-gradient(180deg,#e9f3fb,#fbfdff);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}button,input{font:inherit}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:12px 14px;box-shadow:0 8px 22px rgba(0,0,0,.14)}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);object-fit:cover}.brand b{display:block;font-size:14px;line-height:1.08}.brand small{opacity:.8;font-size:11px}
.wrap{max-width:760px;margin:auto;padding:12px 12px 20px}.hero{background:linear-gradient(135deg,var(--navy),#0d61b0);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border:20px solid rgba(33,183,239,.28);border-radius:50%}.hero h1{margin:0 0 5px;font-size:25px}.hero p{margin:0;opacity:.85;font-size:14px}
.card{background:#fff;border:1px solid #e0eaf2;border-radius:18px;padding:15px;box-shadow:var(--shadow)}.grid{display:grid;gap:11px}.two{grid-template-columns:1fr 1fr}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.muted{color:var(--muted)}.big{font-size:31px;font-weight:900}.money{font-size:37px;font-weight:900}
.status{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900}.ok{background:#def6ea;color:#0b8353}.warn{background:#fff1d4;color:#996200}.info{background:#dff2ff;color:#0873a8}.bad{background:#ffe1e1;color:#ad3030}
.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:850;cursor:pointer}.btn.primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff}.btn.navy{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}.btn.light{background:#eaf2f8;color:var(--text)}.btn.danger{background:#ffe3e3;color:#a32626}.btn:disabled{opacity:.45}
.input{width:100%;padding:12px 13px;border:1px solid #c9d8e6;border-radius:12px;background:#fff;color:var(--text)}.pill{padding:6px 9px;background:#eef5fa;border-radius:999px;font-size:12px}.vehicle{border:1px solid var(--line);border-radius:15px;padding:13px}.vehicle.selected{border-color:var(--blue);background:#eef9ff}.hidden{display:none!important}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#05265c;color:#fff;padding:11px 16px;border-radius:999px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50}.toast.show{display:block}
.qrbox{width:170px;height:170px;margin:13px auto;background:linear-gradient(90deg,#082858 11px,transparent 11px) 0 0/31px 31px,linear-gradient(#082858 11px,transparent 11px) 0 0/31px 31px,#fff;border:10px solid #fff;box-shadow:0 0 0 1px #d6e2ec}.kpis{grid-template-columns:repeat(2,1fr)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}.table th{color:#5e6f8b}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{min-height:105px;text-align:left;border:0;border-radius:17px;padding:15px;background:#fff;color:var(--text);box-shadow:var(--shadow)}.action.navy{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}.action.blue{background:linear-gradient(135deg,#087bc7,#0ca6e9);color:#fff}.action .ico{font-size:26px;display:block;margin-bottom:10px}.action small{display:block;opacity:.77;margin-top:4px}
.bar{height:10px;background:#dce7f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}.switch{display:flex;background:#eaf2f8;padding:4px;border-radius:12px}.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:800;color:#62728c}.switch button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.08)}.loginbox{max-width:430px;margin:auto}.note{background:#f5f9fd;border-radius:13px;padding:11px;color:#5d6d87;font-size:13px}.pdfbox{width:100%;height:72vh;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}

<div id="employeeApp" class="hidden"><div class="card"><div class="row between"><div><small class="muted">Ocupación</small><div class="big"><span id="eInside">0</span>/120</div></div><div style="min-width:45%"><div class="bar"><i id="eBar" style="width:0%"></i></div><small id="eFree" class="muted">120 libres</small></div></div></div><div class="actions" style="margin-top:11px"><button class="action navy" onclick="scanQR()"><span class="ico">▣</span><b>Escanear QR</b><small>Demo: Grupo Pérez</small></button><button class="action blue" onclick="searchEmployee()"><span class="ico">⌕</span><b>Buscar</b><small>Apellido / patente</small></button></div><div class="card" style="margin-top:11px"><div class="row"><input id="eSearch" class="input" value="Pérez" placeholder="Apellido o patente"><button class="btn primary" onclick="searchEmployee()">Buscar</button></div></div><div id="employeeResult" style="margin-top:11px"></div><div class="card" style="margin-top:11px"><button class="btn danger" style="width:100%" onclick="resetDemo()">Resetear demo</button></div></div>
</main><div id="toast" class="toast"></div><script>const STORAGE_KEY='cgb_shortcuts_state_v1';const DEFAULT={member:{dni:'30111222',password:'club123',name:'Juan Pérez',status:'active',exempt:false,vehicles:[{make:'Honda',model:'Civic',year:2001,plate:'AB123CD'},{make:'Toyota',model:'Corolla',year:2018,plate:'AE555QR'}]},tariffs:{active:3500,delinquent:6000,visitor:4500,nonmember:7000},payments:{},parking:{inside:[],entries:0,revenue:0,movements:[]},settings:{account:'Mercado Pago · Cuenta del Club',alias:'CLUB.BELGRANO.PARKING'},demo:{selectedPlate:null,adminRole:'admin'}};function clone(x){return JSON.parse(JSON.stringify(x))}let state;try{state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')||clone(DEFAULT)}catch(e){state=clone(DEFAULT)}function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}function resetDemo(){if(confirm('¿Resetear la demo?')){state=clone(DEFAULT);save();location.reload()}}function $(id){return document.getElementById(id)}function money(n){return '$'+Number(n||0).toLocaleString('es-AR')}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function employeeLogin(){if($('eUser').value==='operador'&&$('ePass').value==='operador123'){$('loginView').classList.add('hidden');$('employeeApp').classList.remove('hidden');renderEmployee();toast('Operador autenticado')}else toast('Usuario demo: operador / operador123')}function renderEmployee(){$('eInside').textContent=state.parking.inside.length;$('eFree').textContent=(120-state.parking.inside.length)+' libres';$('eBar').style.width=Math.round(state.parking.inside.length/120*100)+'%'}function scanQR(){$('eSearch').value='Pérez';searchEmployee();toast('QR familiar leído')}function searchEmployee(showToast=true){let q=($('eSearch').value||'').trim().toUpperCase();let match=q.includes('PÉREZ')||q.includes('PEREZ')||q===state.member.dni||state.member.vehicles.some(v=>v.plate===q);if(!match){$('employeeResult').innerHTML='<div class="card"><p class="muted">Sin resultados.</p></div>';return}$('employeeResult').innerHTML=`<div class="card"><div class="row between"><div><h2 style="margin:0">${state.member.name}</h2><div class="muted">DNI ${state.member.dni} · Grupo Pérez</div></div>${state.member.exempt?'<span class="status info">EXENTO</span>':'<span class="status ok">SOCIO AL DÍA</span>'}</div><div class="grid" style="margin-top:10px">${state.member.vehicles.map(v=>empVehicle(v)).join('')}</div></div>`;if(showToast)toast('Cliente encontrado')}function empVehicle(v){let paid=!!state.payments[v.plate]||state.member.exempt,inside=state.parking.inside.includes(v.plate);return `<div class="vehicle"><div class="row between"><div><b>${v.make} ${v.model} ${v.year}</b><div class="big" style="font-size:23px">${v.plate}</div></div>${paid?'<span class="status ok">PAGADO</span>':'<span class="status warn">PENDIENTE</span>'}</div><div class="muted">${state.member.exempt?'Libre estacionamiento':money(state.tariffs.active)}</div><div class="actions" style="margin-top:8px">${paid?'':`<button class="btn navy" onclick="employeePay('${v.plate}','Mercado Pago')">Mercado Pago</button><button class="btn light" onclick="employeePay('${v.plate}','Efectivo')">Efectivo</button>`}<button class="btn primary" onclick="entry('${v.plate}')">${inside?'Ya está dentro':'Registrar ingreso'}</button><button class="btn light" onclick="exitVehicle('${v.plate}')">Salida</button></div></div>`}function employeePay(plate,method){if(state.payments[plate])return toast('Patente ya paga');state.payments[plate]={amount:state.tariffs.active,method,approved:true,time:new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})};if(method!=='Libre')state.parking.revenue+=state.tariffs.active;state.parking.movements.unshift({time:new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),plate,action:'PAGO',payment:method==='Mercado Pago'?'MP':'EFECTIVO'});save();searchEmployee(false);renderEmployee();toast('Pago registrado para '+plate)}function entry(plate){if(state.parking.inside.includes(plate))return toast('Ese vehículo ya figura dentro');if(!state.payments[plate]&&!state.member.exempt)return toast('Esta patente no tiene pago aprobado');state.parking.inside.push(plate);state.parking.entries++;state.parking.movements.unshift({time:new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),plate,action:'INGRESO',payment:state.member.exempt?'EXENTO':(state.payments[plate]?.method||'-')});save();renderEmployee();searchEmployee(false);toast('Ingreso registrado: '+plate)}function exitVehicle(plate){let i=state.parking.inside.indexOf(plate);if(i<0)return toast('El vehículo no figura dentro');state.parking.inside.splice(i,1);state.parking.movements.unshift({time:new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),plate,action:'SALIDA',payment:'-'});save();renderEmployee();searchEmployee(false);toast('Salida registrada: '+plate)}</script></body></html>
